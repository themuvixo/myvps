name: Quick Instant Terminal (Zero-Auth)

on:
  workflow_dispatch:
    inputs:
      connection_method:
        description: "Direct connection method"
        required: true
        default: "web_terminal"
        type: choice
        options:
          - "web_terminal"
          - "ssh_terminal"
      tunnel_provider:
        description: "Tunnel provider (Zero-Auth)"
        required: true
        default: "trycloudflare"
        type: choice
        options:
          - "trycloudflare"
          - "tmate"
          - "bore"
          - "pinggy"

permissions:
  contents: read

concurrency:
  group: "terminal-${{ github.ref }}-${{ inputs.tunnel_provider }}"
  cancel-in-progress: true

jobs:
  terminal:
    name: "Terminal (${{ inputs.connection_method }} / ${{ inputs.tunnel_provider }})"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TERM_USER: "runner"
      TERM_PASS: "Cynet@2026"
      WEB_PORT: "7681"
      SSH_PORT: "22"

    steps:
      # ────────────────────────────────────────────────────────────────
      # 1. Base system setup & credentials
      # ────────────────────────────────────────────────────────────────
      - name: "1 · System setup & credentials"
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Configuring credentials ==="
          echo "${TERM_USER}:${TERM_PASS}" | sudo chpasswd
          echo "root:${TERM_PASS}"            | sudo chpasswd

          sudo usermod -aG sudo "${TERM_USER}"
          echo "${TERM_USER} ALL=(ALL) NOPASSWD:ALL" \
            | sudo tee /etc/sudoers.d/runner >/dev/null

          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/'                 /etc/ssh/sshd_config
          sudo systemctl restart ssh || sudo service ssh restart || true

      # ────────────────────────────────────────────────────────────────
      # 2. Optional: ttyd web terminal (auto-login as root)
      # ────────────────────────────────────────────────────────────────
      - name: "2 · Setup web terminal (ttyd)"
        if: inputs.connection_method == 'web_terminal' && inputs.tunnel_provider != 'tmate'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Installing standalone ttyd ==="
          sudo systemctl stop    ttyd 2>/dev/null || true
          sudo systemctl disable ttyd 2>/dev/null || true
          sudo pkill -9 ttyd          2>/dev/null || true

          sudo curl -fsSL \
            https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64 \
            -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd

          # Auto-login straight into root bash — no login prompt
          sudo /usr/local/bin/ttyd -p "${WEB_PORT}" -W /bin/bash >/tmp/ttyd.log 2>&1 &
          sleep 2

      # ────────────────────────────────────────────────────────────────
      # 3. Tunnel: TryCloudflare (Zero-Auth)
      # ────────────────────────────────────────────────────────────────
      - name: "3 · Tunnel: TryCloudflare"
        if: inputs.tunnel_provider == 'trycloudflare'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Launching TryCloudflare ==="
          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          if [[ "${{ inputs.connection_method }}" == "web_terminal" ]]; then
            TARGET="http://localhost:${WEB_PORT}"
          else
            TARGET="tcp://localhost:${SSH_PORT}"
          fi

          /usr/local/bin/cloudflared tunnel --url "${TARGET}" --no-autoupdate \
            >/tmp/cf.log 2>&1 &

          TUNNEL_URL=""
          for _ in {1..50}; do
            sleep 2
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -n1 || true)
            if [[ -n "${TUNNEL_URL}" ]]; then break; fi
          done

          if [[ -z "${TUNNEL_URL}" ]]; then
            echo "❌ Cloudflare failed — logs:"
            cat /tmp/cf.log
            exit 1
          fi

          echo "=================================================="
          echo ">>> TRYCLOUDFLARE READY <<<"
          echo "URL / Hostname: ${TUNNEL_URL}"
          echo "=================================================="

          if [[ "${{ inputs.connection_method }}" == "web_terminal" ]]; then
            {
              echo "## ⚡ Web Terminal Ready (TryCloudflare)"
              echo
              echo "### 🌐 [Click to open web terminal](${TUNNEL_URL})"
              echo
              echo "| Field   | Value |"
              echo "|---------|-------|"
              echo "| Link    | [${TUNNEL_URL}](${TUNNEL_URL}) |"
              echo "| Status  | Instant root bash (no login required) |"
            } >>"${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## ⚡ SSH Terminal Ready (TryCloudflare)"
              echo
              echo "| Field           | Value |"
              echo "|-----------------|-------|"
              echo "| Tunnel hostname | \`${TUNNEL_URL}\` |"
              echo "| Local proxy     | \`cloudflared access tcp --hostname ${TUNNEL_URL} --url localhost:2222\` |"
              echo "| SSH command     | \`ssh ${TERM_USER}@localhost -p 2222\` (password: \`${TERM_PASS}\`) |"
            } >>"${GITHUB_STEP_SUMMARY}"
          fi

      # ────────────────────────────────────────────────────────────────
      # 4. Tunnel: Tmate (Zero-Auth web & SSH)
      # ────────────────────────────────────────────────────────────────
      - name: "4 · Tunnel: Tmate"
        if: inputs.tunnel_provider == 'tmate'
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false
          limit-access-to-actor: false

      # ────────────────────────────────────────────────────────────────
      # 5. Tunnel: Bore (Zero-Auth direct TCP)
      # ────────────────────────────────────────────────────────────────
      - name: "5 · Tunnel: Bore"
        if: inputs.tunnel_provider == 'bore'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Setting up Bore tunnel ==="
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /tmp
          chmod +x /tmp/bore

          if [[ "${{ inputs.connection_method }}" == "web_terminal" ]]; then
            TARGET_PORT="${WEB_PORT}"
          else
            TARGET_PORT="${SSH_PORT}"
          fi

          /tmp/bore local "${TARGET_PORT}" --to bore.pub >/tmp/bore.log 2>&1 &

          REMOTE_PORT=""
          for _ in {1..30}; do
            sleep 2
            REMOTE_PORT=$(grep -oE 'bore\.pub:[0-9]+' /tmp/bore.log | head -n1 | cut -d: -f2 || true)
            if [[ -n "${REMOTE_PORT}" ]]; then break; fi
          done

          echo "=================================================="
          echo ">>> BORE TUNNEL READY <<<"
          echo "bore.pub:${REMOTE_PORT}"
          echo "=================================================="

          if [[ "${{ inputs.connection_method }}" == "web_terminal" ]]; then
            {
              echo "## ⚡ Web Terminal Ready (Bore)"
              echo
              echo "### 🌐 [Open web terminal](http://bore.pub:${REMOTE_PORT})"
              echo
              echo "- **Direct link**: \`http://bore.pub:${REMOTE_PORT}\`"
            } >>"${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## ⚡ SSH Ready (Bore direct TCP)"
              echo
              echo "| Field    | Value |"
              echo "|----------|-------|"
              echo "| Command  | \`ssh ${TERM_USER}@bore.pub -p ${REMOTE_PORT}\` |"
              echo "| Password | \`${TERM_PASS}\` |"
            } >>"${GITHUB_STEP_SUMMARY}"
          fi

      # ────────────────────────────────────────────────────────────────
      # 6. Tunnel: Pinggy (Zero-Auth)
      # ────────────────────────────────────────────────────────────────
      - name: "6 · Tunnel: Pinggy"
        if: inputs.tunnel_provider == 'pinggy'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Setting up Pinggy ==="
          PINGGY_OPTS=(
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ServerAliveInterval=30
            -N
            -p 443
          )

          if [[ "${{ inputs.connection_method }}" == "web_terminal" ]]; then
            ssh "${PINGGY_OPTS[@]}" -R0:localhost:"${WEB_PORT}" a.pinggy.io     >/tmp/pinggy.log 2>&1 &
          else
            ssh "${PINGGY_OPTS[@]}" -R0:localhost:"${SSH_PORT}" tcp@a.pinggy.io >/tmp/pinggy.log 2>&1 &
          fi

          PINGGY_CONN=""
          for _ in {1..30}; do
            sleep 2
            PINGGY_CONN=$(grep -oE '[a-z0-9.-]+\.a\.pinggy\.io(:[0-9]+)?' /tmp/pinggy.log | head -n1 || true)
            if [[ -n "${PINGGY_CONN}" ]]; then break; fi
          done

          echo "Endpoint: ${PINGGY_CONN}"

          {
            echo "## ⚡ Terminal Ready (Pinggy)"
            echo
            echo "| Field    | Value |"
            echo "|----------|-------|"
            echo "| URL / target | \`${PINGGY_CONN}\` |"
            echo "| User     | \`${TERM_USER}\` |"
            echo "| Password | \`${TERM_PASS}\` |"
          } >>"${GITHUB_STEP_SUMMARY}"

      # ────────────────────────────────────────────────────────────────
      # 7. Keep the runner alive
      # ────────────────────────────────────────────────────────────────
      - name: "7 · Keep session alive"
        if: inputs.tunnel_provider != 'tmate'
        shell: bash
        run: |
          for i in {1..360}; do
            sleep 60
            echo "[${i}/360 min] Terminal active…"
          done
